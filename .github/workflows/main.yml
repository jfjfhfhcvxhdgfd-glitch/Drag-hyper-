name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # 1. WINDOWS, RDP, KULLANICI, PAROLA VE SES AYARLARI
      - name: Configure Windows RDP Audio and User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          # Parolayi gizli degerden al
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "RDP_PASSWORD Secret eksik."
          }

          # Windows parola ilkesi icin temel kontrol
          if ($password.Length -lt 14) {
            throw "RDP_PASSWORD en az 14 karakter olmali."
          }

          $categories = 0
          if ($password -cmatch '[A-Z]') { $categories++ }
          if ($password -cmatch '[a-z]') { $categories++ }
          if ($password -match '[0-9]') { $categories++ }
          if ($password -match '[^a-zA-Z0-9]') { $categories++ }

          if ($categories -lt 3) {
            throw "Parola buyuk harf, kucuk harf, rakam ve sembol kategorilerinden en az ucunu icermeli."
          }

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          # RDP'yi etkinlestir
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $rdpPath `
            -Name fDenyTSConnections -Value 0

          # Ag Duzeyinde Kimlik Dogrulamasi acik kalsin
          $tcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $tcpPath `
            -Name UserAuthentication -Value 1

          # Ses ve mikrofon yonlendirme ilkeleri
          $audioPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $audioPath -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioCapture -Value 0 `
            -PropertyType DWord -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioPlayback -Value 0 `
            -PropertyType DWord -Force | Out-Null

          # Draghyper kullanicisini olustur veya parolasini yenile
          try {
            $user = Get-LocalUser -Name "Draghyper" `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser -Name "Draghyper" `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -ErrorAction Stop | Out-Null
            } else {
              Set-LocalUser -Name "Draghyper" `
                -Password $securePassword `
                -ErrorAction Stop
            }
          } catch {
            throw "Draghyper hesabi veya parolasi ayarlanamadi. Secret degerini ve Windows parola ilkesini kontrol et. Ayrinti: $($_.Exception.Message)"
          }

          # Uzak masaustu ve yonetici gruplari
          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Administrators" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          # RDP guvenlik duvari kurallari
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -Name "RDP-Tailscale" `
              -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" `
              -DisplayName "RDP via Tailscale" `
              -Direction Inbound -Protocol TCP `
              -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Windows RDP, kullanici ve ses ilkeleri ayarlandi."
          Write-Host "Parola guvenlik nedeniyle yazdirilmadi."

      # 2. TAILSCALE KURULUMU VE BAGLANTI
      - name: Install and Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            throw "TAILSCALE_AUTH_KEY Secret eksik."
          }

          $msi = Join-Path $env:TEMP "tailscale-setup.msi"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $url -OutFile $msi

          $install = Start-Process msiexec.exe `
            -ArgumentList @("/i", $msi, "/qn", "/norestart") `
            -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Tailscale kurulumu basarisiz. MSI kodu: $($install.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale programi bulunamadi."
          }

          # Tailscale hizmetinin baslamasini bekle
          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            $service = Get-Service -Name Tailscale `
              -ErrorAction SilentlyContinue

            if ($null -ne $service -and $service.Status -eq "Running") {
              $ready = $true
              break
            }

            if ($null -ne $service -and $service.Status -ne "Running") {
              Start-Service -Name Tailscale `
                -ErrorAction SilentlyContinue
            }

            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw "Tailscale hizmeti baslatilamadi."
          }

          # Anahtari gunluge yazdirmadan baglan
          & $tailscale up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale girisi basarisiz. Auth Key ve cihaz politikasini kontrol et."
          }

          # IPv4 adresini bekle
          $ip = $null

          for ($i = 0; $i -lt 30; $i++) {
            $ips = & $tailscale ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ips) {
              $ip = ($ips | Select-Object -First 1).Trim()

              if (-not [string]::IsNullOrWhiteSpace($ip)) {
                break
              }
            }

            Start-Sleep -Seconds 2
          }

          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw "Tailscale IPv4 adresi alinamadi."
          }

          "RDP_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale baglantisi basarili."
          Write-Host "RDP IP adresi: $ip"

      # 3. BAGLANTI BILGILERI VE DURUM KONTROLU
      - name: Verify RDP and Show Connection Information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Windows surumu:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "Islemci ve bellek:"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object NumberOfLogicalProcessors,
              @{Name="RAM_GB";Expression={
                [math]::Round($_.TotalPhysicalMemory / 1GB, 2)
              }}

          Write-Host "RDP hizmeti:"
          Get-Service TermService |
            Select-Object Name, Status

          Write-Host "RDP portu:"
          Get-NetTCPConnection -State Listen `
            -LocalPort 3389 -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State

          Write-Host "RDP kullanicisi: Draghyper"
          Write-Host "Tailscale IP: $env:RDP_IP"
          Write-Host "RDP portu: 3389"
          Write-Host "Parola gunluge yazdirilmadi."

      # 4. OTURUMU ACIK TUT
      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "RDP oturumu hazir. GitHub sure siniri gecerlidir."

          while ($true) {
            Start-Sleep -Seconds 300
          }
