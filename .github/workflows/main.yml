- name: Configure RDP, Audio and User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          # Secret kontrolu
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "RDP_PASSWORD Secret eksik veya bos."
          }

          # Windows parola kurali icin temel kontrol
          if ($password.Length -lt 14) {
            throw "RDP_PASSWORD en az 14 karakter olmali. GitHub Secret'i guncelle."
          }

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          # RDP ayarlari
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $rdpPath `
            -Name fDenyTSConnections -Value 0

          $tcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $tcpPath `
            -Name UserAuthentication -Value 1

          # Ses ve mikrofon politikalari
          $audioPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $audioPath -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioCapture -Value 0 `
            -PropertyType DWord -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioPlayback -Value 0 `
            -PropertyType DWord -Force | Out-Null

          # Draghyper kullanicisini olustur veya parolasini guncelle
          try {
            $user = Get-LocalUser -Name "Draghyper" `
              -ErrorAction SilentlyContinue

            if ($null -eq $user) {
              New-LocalUser -Name "Draghyper" `
                -Password $securePassword `
                -PasswordNeverExpires `
                -AccountNeverExpires `
                -ErrorAction Stop | Out-Null
            } else {
              Set-LocalUser -Name "Draghyper" `
                -Password $securePassword `
                -ErrorAction Stop
            }
          } catch {
            throw "Draghyper kullanicisi/parolasi ayarlanamadi. Windows parola ilkesini ve Secret degerini kontrol et. Ayrinti: $($_.Exception.Message)"
          }

          # Gerekli gruplara ekle
          Add-LocalGroupMember -Group "Administrators" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member "Draghyper" -ErrorAction SilentlyContinue

          # Guvenlik duvari ve RDP servisi
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          if (-not (Get-NetFirewallRule -Name "RDP-Tailscale" `
              -ErrorAction SilentlyContinue)) {
            New-NetFirewallRule -Name "RDP-Tailscale" `
              -DisplayName "RDP via Tailscale" `
              -Direction Inbound -Protocol TCP `
              -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          }

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Parola veya Secret degerini gunluge yazdirma
          Write-Host "RDP kullanicisi ve ses ayarlari tamamlandi."
