
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare Windows, RDP and Microphone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Windows ve RDP hazirlaniyor..."

          # RDP ayarlari
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $rdpPath -Name fDenyTSConnections -Value 0

          $tcpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $tcpPath -Name UserAuthentication -Value 0
          Set-ItemProperty -Path $tcpPath -Name SecurityLayer -Value 0

          # MIKROFON VE SES YONLENDIRME
          $audioPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          New-Item -Path $audioPath -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioCapture -Value 0 `
            -PropertyType DWord -Force | Out-Null

          New-ItemProperty -Path $audioPath `
            -Name fDisableAudioPlayback -Value 0 `
            -PropertyType DWord -Force | Out-Null

          Write-Host "Mikrofon ve ses ilkeleri ayarlandi."

          # Guvenlik duvari
          Get-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow | Out-Null

          # RDP kullanicisi ve parola
          $username = "Draghyper"
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#_-"
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          $password = -join (1..20 | ForEach-Object {
            $bytes = New-Object byte[] 4
            $rng.GetBytes($bytes)
            $index = [BitConverter]::ToUInt32($bytes, 0) % $chars.Length
            $chars[[int]$index]
          })

          $rng.Dispose()

          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username -Password $securePassword
            Enable-LocalUser -Name $username
          } else {
            New-LocalUser -Name $username `
              -Password $securePassword `
              -PasswordNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group "Administrators" `
            -Member $username -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" `
            -Member $username -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" | Out-File $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

          # RDP hizmetini baslat
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService -ErrorAction SilentlyContinue

          gpupdate /target:computer /force

          Restart-Service -Name TermService -Force

          Write-Host "Windows ve RDP ayarlari tamamlandi."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY GitHub Secret eksik."
          }

          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale kurulumu basarisiz."
          }

          Start-Service Tailscale -ErrorAction SilentlyContinue

          $hostname = "gh-runner-$env:GITHUB_RUN_ID"

          & $tailscale up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname"

          Start-Sleep -Seconds 5

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()

          if (!$ip) {
            throw "Tailscale IP adresi alinamadi."
          }

          "TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Tailscale baglantisi hazir."

      - name: Verify and display system information
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          $computer = Get-CimInstance Win32_ComputerSystem

          Write-Host ""
          Write-Host "========== SISTEM BILGILERI =========="
          Write-Host "Bilgisayar: $env:COMPUTERNAME"
          Write-Host "Windows: $($os.Caption)"
          Write-Host "Surum: $($os.Version)"
          Write-Host "Islemci: $($cpu.Name)"
          Write-Host ("RAM: {0:N2} GB" -f ($computer.TotalPhysicalMemory / 1GB))

          Write-Host ""
          Write-Host "========== DISKLER =========="

          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            ForEach-Object {
              Write-Host ("{0} Toplam: {1:N2} GB | Bos: {2:N2} GB" -f
                $_.DeviceID, ($_.Size / 1GB), ($_.FreeSpace / 1GB))
            }

          Write-Host ""
          Write-Host "========== GRAFIK =========="

          Get-CimInstance Win32_VideoController |
            ForEach-Object { Write-Host $_.Name }

          Write-Host ""
          Write-Host "========== RDP VE SES =========="
          Write-Host "RDP portu: 3389"
          Write-Host "Kullanici: $env:RDP_USERNAME"

          $listener = Get-NetTCPConnection -LocalPort 3389 `
            -State Listen -ErrorAction SilentlyContinue

          Write-Host "RDP dinleme: $(if ($listener) {'HAZIR'} else {'KONTROL GEREKIYOR'})"
          Write-Host "Mikrofon yonlendirme ilkesi: Etkinlestirildi"
          Write-Host "Ses cikisi yonlendirme ilkesi: Etkinlestirildi"

          Write-Host ""
          Write-Host "========== AG =========="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Write-Host ""
          Write-Host "========== SERVISLER =========="

          Get-Service TermService,Tailscale -ErrorAction SilentlyContinue |
            Format-Table Name,Status,StartType -AutoSize |
            Out-String | Write-Host

          Write-Host ""
          Write-Host "========== BAGLANTI BILGILERI =========="
          Write-Host "Adres: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "Kullanici adi: $env:RDP_USERNAME"
          Write-Host "Parola: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "========== HAZIRLIK TAMAMLANDI =========="

      - name: Maintain connection
        shell: pwsh
        run: |
          Write-Host "Windows oturumu calisiyor."

          while ($true) {
            Write-Host "Durum: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
            Start-Sleep -Seconds 300
          }
          
